# Auto-provisions the Prometheus datasource on Grafana startup.
# Name MUST be "Prometheus" — GrafanaDashboardGenerator references the
# datasource by this name in every panel.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
