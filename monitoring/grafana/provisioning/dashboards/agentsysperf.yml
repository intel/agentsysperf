# Tells Grafana to load any dashboard JSON found in /var/lib/grafana/dashboards.
# The AgentSysPerf dashboard JSON is generated by scripts/push_to_prometheus.py
# into monitoring/grafana/dashboards/agentsysperf_dashboard.json.
apiVersion: 1

providers:
  - name: AgentSysPerf
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
